<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>namzero-lite</title>
<style>
:root { --bg:#15171c; --card:#1e222b; --line:#2c3240; --txt:#e6e9ef; --dim:#8b93a7; --acc:#4fd1c5; --on:#f6c453; }
* { box-sizing:border-box; }
/* clip (non hidden): evita lo scroll orizzontale senza creare un contenitore
   di scorrimento, che romperebbe l'header sticky. */
html, body { max-width:100%; overflow-x:clip; }
body { margin:0; font:14px/1.35 -apple-system,system-ui,sans-serif; background:var(--bg); color:var(--txt); }
header { display:flex; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.5px; }
#status { color:var(--dim); font-size:12px; min-width:0; display:flex; align-items:center; gap:8px; font-variant-numeric:tabular-nums; }
#renameInput.hidden { display:none; }
#presetselect { background:var(--card); color:#fff; border:1px solid var(--line); border-radius:6px; padding:3px 8px; font-size:18px; font-weight:600; max-width:320px; min-width:0; cursor:pointer; }
#actions { display:flex; gap:8px; align-items:center; margin-left:auto; }

#menu { display:none; }
#spinner { position:fixed; inset:0; background:rgba(8,10,14,.6); display:flex; align-items:center; justify-content:center; z-index:50; backdrop-filter:blur(2px); }
#spinner.hidden { display:none; }
#spinner .ring { width:64px; height:64px; border:5px solid rgba(255,255,255,.15); border-top-color:#4fd1c5; border-radius:50%; animation:spinner-spin .8s linear infinite; }
@keyframes spinner-spin { to { transform:rotate(360deg); } }
#statustext { color:#fff; font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
main { display:flex; gap:12px; padding:16px; overflow-x:auto; min-width:0; max-width:100%; align-items:flex-start; justify-content:center; justify-content: safe center; }
.pedal { background:var(--card); border:1px solid rgba(0,0,0,.18); border-radius:12px; padding:10px; width:190px; flex:0 0 auto; color:#16181d; box-shadow:0 2px 10px rgba(0,0,0,.35); }
.pedal h2 { font-size:12px; text-transform:uppercase; letter-spacing:1px; margin:0 0 8px; color:#16181d; display:flex; justify-content:space-between; align-items:center; }
.pedal h2 .fstate { font-size:10px; text-transform:lowercase; letter-spacing:0; color:rgba(0,0,0,.55); border:1px solid rgba(0,0,0,.25); border-radius:8px; padding:0 6px; }
.pedal h2 .fstate.on { background:#2563eb; border-color:#2563eb; color:#fff; box-shadow:0 0 8px rgba(37,99,235,.45); }
.power { width:26px; height:26px; border-radius:50%; border:1px solid rgba(0,0,0,.25); background:rgba(255,255,255,.45); color:#16181d; cursor:pointer; font-size:12px; }
.power.on { background:#2563eb; color:#fff; border-color:#2563eb; box-shadow:0 0 10px rgba(37,99,235,.55); }
.pedal select { width:100%; background:rgba(255,255,255,.55); color:#16181d; border:1px solid rgba(0,0,0,.2); border-radius:6px; padding:4px; margin:6px 0; }
.pedal .knob { display:grid; grid-template-columns:1fr auto; gap:2px 6px; margin-top:6px; font-size:11px; color:rgba(0,0,0,.62); }
.pedal .knob output { color:#16181d; font-variant-numeric:tabular-nums; }
.pedal .knob input { grid-column:1 / -1; width:100%; -webkit-appearance:none; appearance:none; height:18px; background:transparent; }
.pedal .knob input::-webkit-slider-runnable-track { height:4px; background:#9a9a9a; border-radius:2px; }
.pedal .knob input::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; margin-top:-5px; border-radius:50%; background:#fff; border:1px solid rgba(0,0,0,.3); }
.pedal .knob input::-moz-range-track { height:4px; background:#9a9a9a; border-radius:2px; }
.pedal .knob input::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#fff; border:1px solid rgba(0,0,0,.3); }
.pedal .foot { display:flex; justify-content:flex-start; margin-top:8px; }
#rack { margin:0 16px 16px; background:linear-gradient(#2b303b,#22262f); border:1px solid #3a4150; border-radius:10px; padding:10px 16px 14px; box-shadow:inset 0 1px 0 rgba(255,255,255,.06); }
.rack-title { display:flex; align-items:center; font-size:11px; letter-spacing:2px; color:#8b93a7; text-transform:uppercase; margin-bottom:8px; }
#rack-units { display:flex; gap:32px; flex-wrap:wrap; align-items:flex-start; }
.unit { min-width:230px; padding:0 0 0 16px; border-left:1px solid #3a4150; }
.unit:first-child { border-left:none; padding-left:0; }
.unit h3 { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:#cfd6e4; margin:0 0 6px; display:flex; gap:6px; align-items:center; }
.unit .knob { display:grid; grid-template-columns:1fr auto; gap:2px 6px; margin-top:6px; font-size:11px; color:#8b93a7; }
.unit .knob output { color:#e6e9ef; font-variant-numeric:tabular-nums; }
.unit .knob input { grid-column:1 / -1; width:100%; -webkit-appearance:none; appearance:none; height:18px; background:transparent; }
.unit .knob input::-webkit-slider-runnable-track { height:4px; background:#9a9a9a; border-radius:2px; }
.unit .knob input::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; margin-top:-5px; border-radius:50%; background:#fff; border:1px solid rgba(0,0,0,.3); }
.unit .knob input::-moz-range-track { height:4px; background:#9a9a9a; border-radius:2px; }
.unit .knob input::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#fff; border:1px solid rgba(0,0,0,.3); }
.unit .foot { display:flex; margin-top:8px; }
.ae-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:6px; font-size:12px; color:#8b93a7; }
.ae-row input { width:74px; background:#12151b; color:#e6e9ef; border:1px solid #3a4150; border-radius:4px; padding:2px 6px; font-size:12px; }
/* EQ globale: 5 slider verticali compatti. Lo slider resta orizzontale e viene
   ruotato di -90 gradi dentro un contenitore alto: funziona su tutti i browser
   (writing-mode verticale non e' affidabile sui WebKit vecchi del Pi). */
.eq-bands { display:flex; gap:4px; align-items:flex-start; margin-top:4px; }
.eq-band { display:flex; flex-direction:column; align-items:center; width:30px; font-size:10px; color:#8b93a7; }
.eq-band output { color:#e6e9ef; font-variant-numeric:tabular-nums; height:13px; }
.eq-band .eq-slider { position:relative; width:30px; height:92px; }
.eq-band .eq-slider input { position:absolute; left:50%; top:50%; width:88px; height:18px; margin:0;
  transform:translate(-50%,-50%) rotate(-90deg); -webkit-appearance:none; appearance:none;
  background:transparent; }
.eq-band .eq-slider input::-webkit-slider-runnable-track { height:4px; background:#9a9a9a; border-radius:2px; }
.eq-band .eq-slider input::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; margin-top:-5px;
  border-radius:50%; background:#fff; border:1px solid rgba(0,0,0,.3); }
.eq-band .eq-slider input::-moz-range-track { height:4px; background:#9a9a9a; border-radius:2px; }
.eq-band .eq-slider input::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#fff;
  border:1px solid rgba(0,0,0,.3); }
.eq-band span { margin-top:2px; }
#looper { min-width:320px; }
#looper.active #loop-bar { border-color:#4fd1c5; box-shadow:0 0 8px rgba(79,209,197,.35); }
#loop-bar { height:12px; background:#262b35; border:1px solid transparent; border-radius:6px; overflow:hidden; margin-top:6px; }
#loop-fill { height:100%; width:0%; background:#4a5568; transition:width .1s linear, background .2s; }
#looper.active #loop-fill { background:#4fd1c5; }
#loop-row { display:flex; align-items:center; gap:6px; margin-top:6px; }
#loop-state { color:#8b93a7; font-size:11px; min-width:130px; font-variant-numeric:tabular-nums; }
#loop-row .act { padding:2px 8px; font-size:12px; }
#files { padding:0 16px 24px; display:flex; gap:24px; flex-wrap:wrap; }
#files section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; min-width:240px; }
#files h3 { font-size:12px; text-transform:uppercase; color:var(--dim); margin:0 0 6px; }
#files code { color:var(--acc); font-size:12px; }
.act { display:inline-flex; align-items:center; justify-content:center; background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; text-decoration:none; font:inherit; font-size:13px; }
.act:disabled { opacity:.45; cursor:default; }
.act.primary { border-color:var(--acc); color:var(--acc); }
.act.saved { background:var(--acc); border-color:var(--acc); color:#16181d; }
.act.err { background:#b00020; border-color:#b00020; color:#fff; }
/* Progressiva: sotto i 720 px l'header resta su una riga (titolo, [slot] +
   combo, hamburger) e undo/Salva/settings passano nel menu. Il resto del layout
   si impila e i pedali restano scrollabili dentro main, mai la pagina. */
@media (max-width:720px) {
  header { gap:8px; padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 10px calc(12px + env(safe-area-inset-left)); }
  h1 { font-size:13px; letter-spacing:0; white-space:nowrap; flex:0 0 auto; }
  #status { flex:1 1 auto; gap:4px; overflow:hidden; }
  #statustext { font-size:15px; flex:0 0 auto; }
  #presetselect { flex:1 1 auto; font-size:16px; padding:3px 6px; max-width:45vw; }
  #menu { display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
          width:42px; height:42px; padding:0; font-size:18px; margin-left:0; }
  #actions { display:none; position:absolute; top:calc(100% - 2px); right:calc(12px + env(safe-area-inset-right));
             z-index:20; flex-direction:column; align-items:stretch; gap:8px; min-width:160px;
             margin:0; padding:10px; background:var(--card); border:1px solid var(--line);
             border-radius:10px; box-shadow:0 10px 28px rgba(0,0,0,.5); }
  #actions.open { display:flex; }
  #actions .act, #actions a { min-height:44px; display:flex; align-items:center; justify-content:center; }
  main { padding:12px calc(12px + env(safe-area-inset-right)) 12px calc(12px + env(safe-area-inset-left)); max-width:100%; }
  #rack { margin:0 calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
          padding:8px 10px 12px;
          max-width:calc(100% - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)); }
  #rack-units { gap:0; }
  .unit { width:100%; min-width:0; padding:14px 0 0; border-left:none; border-top:1px solid #3a4150; }
  .unit:first-child { padding-top:0; border-top:none; }
  .power { width:40px; height:40px; font-size:15px; }
  #looper { min-width:0; width:100%; }
  #loop-row { flex-wrap:wrap; gap:8px; }
  #loop-state { min-width:0; flex:1 1 100%; }
  #loop-row .act { min-width:44px; min-height:44px; }
  .eq-bands { gap:6px; }
  .eq-band { width:44px; }
  .eq-band .eq-slider { width:44px; height:108px; }
  .eq-band .eq-slider input { width:104px; height:30px; }
  .eq-band .eq-slider input::-webkit-slider-thumb { width:20px; height:20px; margin-top:-8px; }
  .eq-band .eq-slider input::-moz-range-thumb { width:20px; height:20px; }
  /* iOS fa zoom al focus se il campo e' sotto i 16px. */
  input:not([type=range]), select { font-size:16px; }
  .ae-row input { width:90px; min-height:36px; }
  #files { padding:0 12px calc(24px + env(safe-area-inset-bottom)); }
  #files section { min-width:0; width:100%; }
  #files code { overflow-wrap:anywhere; }
}
</style>
</head>
<body>
<header>
  <h1>namzero-lite</h1>
  <span id="status"><span id="statustext">…</span><select id="presetselect" title="preset" aria-label="preset"></select><button class="act" id="renameBtn" type="button" title="rinomina preset" aria-label="rinomina preset" style="padding:3px 8px;font-size:13px">✎</button><input id="renameInput" class="hidden" maxlength="32" style="font-size:18px;font-weight:600;color:#fff;background:var(--card);border:1px solid var(--acc);border-radius:6px;padding:3px 8px;width:160px;min-width:0">
  <button class="act" id="menu" type="button" aria-label="menu" aria-expanded="false" aria-controls="actions">☰</button>
  <div id="actions">
    <button class="act" id="undo" disabled title="annulla ultima modifica">Annulla</button>
    <button class="act primary" id="save">Salva</button>
    <a class="act" href="settings.html">Impostazioni</a>
  </div>
</header>
<main id="board"></main>
<div id="spinner" class="hidden"><div class="ring"></div></div>
<section id="rack">
  <div class="rack-title">Opzioni generali <button class="act" id="save-options" style="margin-left:auto;padding:2px 10px;font-size:12px">Salva opzioni</button></div>
  <div id="rack-units"></div>
</section>


<script>
const SLOTS = [
 {id:"comp", name:"Comp", color:"#a3c9a8", knobs:[["threshold","Threshold",-60,0,1,"dB"],["ratio","Ratio",1,10,0.1,""],["attack","Attack",0,50,1,"ms"],["release","Release",20,1000,10,"ms"],["makeup","Makeup",0,12,0.5,"dB"]]},
 {id:"filter", name:"Filter", color:"#e6c39a", knobs:[["rate","Rate",0.05,10,0.05,"Hz"],["depth","Depth",0,1,0.01,""],["q","Q",0.5,8,0.1,""],["mix","Mix",0,1,0.01,""],["low_hz","Low",100,1000,10,"Hz"],["high_hz","High",500,5000,50,"Hz"],["position","Pos",0,1,0.01,""]]},
 {id:"drive", name:"Drive", color:"#e8b39b", types:["fuzz","klon","tubescreamer"], knobs:[["amount","Amount",0,1,0.01,""],["tone","Tone",0,1,0.01,""],["blend","Blend",0,1,0.01,""],["level","Level",-24,24,0.5,"dB"],["mid","Mid",-12,12,0.5,"dB"],["low","Low",-12,12,0.5,"dB"]]},
 {id:"mod", name:"Mod", color:"#c5b3e6", types:["tremolo","univibe","flanger","phaser"], modPosition:true, knobs:[["rate","Rate",0.05,10,0.05,"Hz"],["depth","Depth",0,1,0.01,""],["feedback","Fdbk",0,0.95,0.01,""],["fx_mix","FX mix",0,1,0.01,""]]},
 {id:"amp", name:"Amp", color:"#f2d5a8", knobs:[["trim","Trim",-24,24,0.5,"dB"]]},
 {id:"ir", name:"IR", color:"#b8d8d0", knobs:[]},
 {id:"delay", name:"Delay", color:"#a9c7e8", modes:["stereo","ping_pong","ping_pong_stereo"], knobs:[["time","Time",20,1200,5,"ms"],["feedback","Fdbk",0,0.9,0.01,""],["mix","Mix",0,1,0.01,""],["tone","Tone",0,1,0.01,""]]},
 {id:"reverb", name:"Reverb", color:"#d8b8d8", knobs:[["mix","Mix",0,1,0.01,""],["size","Size",0,1,0.01,""],["damp","Damp",0,1,0.01,""]]},
];
const el = (t, a={}, ...c) => { const n = document.createElement(t); Object.assign(n, a); c.forEach(x => n.append(x)); return n; };
const board = document.getElementById("board");
const knobs = [];
SLOTS.forEach(s => {
  const card = el("div", {className:"pedal"});
  card.style.background = s.color;
  card._color = s.color;
  const head = el("h2"); head.append(s.name);
  const reset = el("button", {className:"power", textContent:"↺", title:"ripristina default dello slot"});
  reset.onclick = () => send({cmd:"defaults", slot:s.id});
  let power = null;
  let filterState = null;
  if (s.id === "filter") {
    // Il filter non ha on/off: si accende solo con l'espressione. Si mostra
    // "auto" quando l'auto-engage lo tiene acceso, "off" altrimenti.
    filterState = el("span", {className:"fstate", textContent:"off"});
    head.append(filterState);
  } else {
    power = el("button", {className:"power", textContent:"⏻"});
    power.onclick = () => send({cmd:"set", slot:s.id, on:!last?.slots?.[s.id]?.on});
    head.append(power);
  }
  card.append(head);
  let select = null;
  if (s.types || s.modes) {
    select = el("select");
    (s.types || s.modes).forEach(v => select.append(el("option", {value:v, textContent:v})));
    select.onchange = () => send({cmd:"set", slot:s.id, ...(s.types ? {type:select.value} : {mode:select.value})});
    card.append(select);
  }
  let position = null;
  if (s.modPosition) {
    // Posizione nella catena: il motore salva il preset e lo ricarica (~300 ms).
    position = el("select", {title:"posizione nella catena"});
    [["pre_amp","pre-amplificatore"], ["post_ir","dopo IR"]].forEach(([v,label]) =>
      position.append(el("option", {value:v, textContent:label})));
    position.onchange = () => send({cmd:"set", slot:s.id, position:position.value});
    card.append(position);
  }
  s.knobs.forEach(([key,label,min,max,step,unit]) => {
    const wrap = el("div", {className:"knob"});
    const lab = el("span", {textContent:label});
    const out = el("output");
    const inp = el("input", {type:"range", min, max, step});
    let t = null;
    inp.oninput = () => { out.textContent = (+inp.value).toFixed(step < 0.1 ? 2 : 1) + unit;
      clearTimeout(t); t = setTimeout(() => send({cmd:"param", slot:s.id, key, value:+inp.value}), 60); };
    wrap.append(lab, out, inp); card.append(wrap);
    knobs.push({slot:s.id, key, inp, out, step, unit});
  });
  const foot = el("div", {className:"foot"}); foot.append(reset); card.append(foot);
  if (s.id === "amp" || s.id === "ir") {
    const fsel = el("select");
    fsel.onchange = () => send({cmd:"file", slot:s.id, file:fsel.value});
    card.append(fsel); card._file = fsel;
  }
  card._power = power; card._select = select; card._pos = position;
  card._filterState = filterState; card._id = s.id;
  board.append(card);
});
// boost
const boostCard = el("div", {className:"unit"});
const bh = el("h3"); bh.append("Boost");
const bpower = el("button", {className:"power", textContent:"⏻"});
bpower.onclick = () => send({cmd:"boost", on:!last?.boost});
const breset = el("button", {className:"power", textContent:"↺", title:"ripristina default"});
breset.onclick = () => send({cmd:"defaults", slot:"boost"});
bh.append(bpower);
boostCard.append(bh);
const bw = el("div", {className:"knob"}); bw.append(el("span", {textContent:"Boost"}));
const bout = el("output"), binp = el("input", {type:"range", min:0, max:24, step:0.5});
let bt = null; binp.oninput = () => { bout.textContent = (+binp.value).toFixed(1) + "dB"; clearTimeout(bt); bt = setTimeout(() => send({cmd:"param", slot:"boost", key:"db", value:+binp.value}), 60); };
bw.append(bout, binp); boostCard.append(bw);
const bfoot = el("div", {className:"foot"}); bfoot.append(breset); boostCard.append(bfoot);
boostCard._power = bpower; boostCard._id = "boost"; boostCard._knob = binp; boostCard._out = bout;
const rackUnits = document.getElementById("rack-units");
// Gate: rack unit (globale), fuori dalla fila dei pedali.
const gateUnit = el("div", {className:"unit"});
const gh = el("h3"); gh.append("Gate");
const gpower = el("button", {className:"power", textContent:"\u23fb"});
gpower.onclick = () => send({cmd:"set", slot:"gate", on:!last?.slots?.gate?.on});
const greset = el("button", {className:"power", textContent:"\u21ba", title:"ripristina default"});
greset.onclick = () => send({cmd:"defaults", slot:"gate"});
gh.append(gpower, greset); gateUnit.append(gh);
[["threshold","Threshold",-90,0,1,"dB"],["attack","Attack",0,50,1,"ms"],["release","Release",20,2000,10,"ms"]].forEach(([key,label,min,max,step,unit]) => {
  const wrap = el("div", {className:"knob"});
  const out = el("output"); const inp = el("input", {type:"range", min, max, step});
  let t = null;
  inp.oninput = () => { out.textContent = (+inp.value).toFixed(step < 0.1 ? 2 : 1) + unit; clearTimeout(t); t = setTimeout(() => send({cmd:"param", slot:"gate", key, value:+inp.value}), 60); };
  wrap.append(el("span", {textContent:label}), out, inp); gateUnit.append(wrap);
  knobs.push({slot:"gate", key, inp, out, step, unit});
});
gateUnit._power = gpower; gateUnit._id = "gate";
rackUnits.append(gateUnit);
rackUnits.append(boostCard);

// EQ globale a 5 bande (opzioni generali, salvato in presets.json con
// "Salva opzioni"). Sempre in catena: il pulsante manda solo on/off live.
const eqUnit = el("div", {className:"unit"});
const eqh = el("h3"); eqh.append("EQ");
const eqPower = el("button", {className:"power", textContent:"\u23fb"});
eqPower.onclick = () => send({cmd:"eq", on:!last?.eq?.on});
const eqReset = el("button", {className:"power", textContent:"\u21ba", title:"ripristina default (piatto)"});
eqReset.onclick = () => send({cmd:"defaults", slot:"eq"});
eqh.append(eqPower, eqReset); eqUnit.append(eqh);
const eqBands = el("div", {className:"eq-bands"});
const eqSliders = [];
["80","250","800","2.5k","8k"].forEach((label, i) => {
  const band = el("div", {className:"eq-band"});
  const out = el("output", {textContent:"0.0"});
  const slider = el("div", {className:"eq-slider"});
  const inp = el("input", {type:"range", min:-12, max:12, step:0.5});
  inp.value = "0";
  let t = null;
  inp.oninput = () => {
    out.textContent = (+inp.value).toFixed(1);
    clearTimeout(t);
    t = setTimeout(() => send({cmd:"eq", band:i, gain:+inp.value}), 60);
  };
  slider.append(inp);
  band.append(out, slider, el("span", {textContent:label}));
  eqBands.append(band);
  eqSliders.push({inp, out});
});
eqUnit.append(eqBands);
// Volume globale: vive in presets.json (eq.volume_db) ma si applica sempre,
// anche a EQ spento. Stesso debounce delle altre manopole.
const eqVolWrap = el("div", {className:"knob"});
const eqVolOut = el("output", {textContent:"6.0 dB"});
const eqVolInp = el("input", {type:"range", min:-24, max:24, step:0.5, title:"volume globale (dB)"});
eqVolInp.value = "6";
let eqVolTimer = null;
eqVolInp.oninput = () => {
  eqVolOut.textContent = (+eqVolInp.value).toFixed(1) + " dB";
  clearTimeout(eqVolTimer);
  eqVolTimer = setTimeout(() => send({cmd:"eq", volume:+eqVolInp.value}), 60);
};
eqVolWrap.append(el("span", {textContent:"Volume"}), eqVolOut, eqVolInp);
eqUnit.append(eqVolWrap);
rackUnits.append(eqUnit);
eqUnit._power = eqPower; eqUnit._id = "eq";
eqUnit._volume = eqVolInp; eqUnit._volumeOut = eqVolOut;

// Auto-engage (opzioni generali, salvate in presets.json): numeri editabili.
const aeUnit = el("div", {className:"unit"});
const aeh = el("h3"); aeh.append("Auto-engage"); aeUnit.append(aeh);
const aeFields = [];
[["engage_ms","Engage ms",0,3000,10,1],["release_ms","Release ms",0,5000,10,1],
 ["threshold","Soglia on %",0,100,1,100],["release_threshold","Soglia off %",0,100,1,100]].forEach(([key,label,min,max,step,scale]) => {
  const row = el("div", {className:"ae-row"});
  const inp = el("input", {type:"number", min, max, step});
  inp.onchange = () => send({cmd:"autoengage", key, value:+inp.value / scale});
  row.append(el("span", {textContent:label}), inp); aeUnit.append(row);
  aeFields.push({key, inp, scale});
});
rackUnits.append(aeUnit);
const soBtn = document.getElementById("save-options");
if (soBtn) soBtn.onclick = () => {
  soBtn.textContent = "…";
  fetch("/api/cmd", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({cmd:"save_options"})})
    .then(r=>r.json()).then(j=>{
      const ok = j && !j.error;
      soBtn.textContent = ok ? "Salvato ✓" : "Errore";
      soBtn.classList.toggle("saved", ok);
      setTimeout(()=>{ soBtn.textContent = "Salva opzioni"; soBtn.classList.remove("saved"); }, 1200);
    }).catch(()=>{ soBtn.textContent = "Errore"; setTimeout(()=>{ soBtn.textContent = "Salva opzioni"; }, 1200); });
};

// Looper compatto nel rack.
const loopSection = el("div", {className:"unit"}); loopSection.id = "looper";
const lh = el("h3"); lh.append("Looper"); loopSection.append(lh);
const loopStateEl = el("div", {id:"loop-state", textContent:"idle · 0.0 s / 60 s"});
const loopBar = el("div", {id:"loop-bar"}); const loopFillEl = el("div", {id:"loop-fill"}); loopBar.append(loopFillEl);
const lrow = el("div", {id:"loop-row"});
const lrec = el("button", {className:"act", id:"loop-rec", textContent:"●"});
const lstop = el("button", {className:"act", id:"loop-stop", textContent:"■"});
const lclr = el("button", {className:"act", id:"loop-clear", textContent:"⌫"});
lrow.append(loopStateEl, lrec, lstop, lclr); loopSection.append(loopBar, lrow);
rackUnits.append(loopSection);
lrec.onclick = () => send({cmd:"looper", action:"toggle"});
lstop.onclick = () => send({cmd:"looper", action:"stop"});
lclr.onclick = () => send({cmd:"looper", action:"clear"});

// Il mod si sposta nella fila in base alla posizione scelta.
const modCard = [...board.children].find(c => c._id === "mod");
const ampCard = [...board.children].find(c => c._id === "amp");
const delayCard = [...board.children].find(c => c._id === "delay");
let lastModPos = "";

let last = null;
const spinnerEl = document.getElementById("spinner");
let spinnerTimer = null;
function showSpinner() {
  if (!spinnerEl) return;
  spinnerEl.classList.remove("hidden");
  clearTimeout(spinnerTimer);
  spinnerTimer = setTimeout(() => spinnerEl.classList.add("hidden"), 6000);
}
function hideSpinner() {
  if (!spinnerEl) return;
  spinnerEl.classList.add("hidden");
  clearTimeout(spinnerTimer);
}

const undoBtn = document.getElementById("undo");
let undoStack = [];
function inverseOf(cmd) {
  if (!last) return null;
  if (cmd.cmd === "param") {
    const v = last.slots?.[cmd.slot]?.[cmd.key];
    return v === undefined ? null : {cmd:"param", slot:cmd.slot, key:cmd.key, value:v};
  }
  if (cmd.cmd === "set") {
    const sl = last.slots?.[cmd.slot];
    if (!sl) return null;
    const inv = {cmd:"set", slot:cmd.slot, on:sl.on};
    if (cmd.type !== undefined) inv.type = sl.type;
    if (cmd.mode !== undefined) inv.mode = sl.mode;
    if (cmd.position !== undefined) inv.position = sl.position;
    return inv;
  }
  if (cmd.cmd === "boost") return {cmd:"boost", on:!!last.boost};
  if (cmd.cmd === "eq") {
    if (cmd.band !== undefined) {
      const g = last?.eq?.gains?.[cmd.band];
      return g === undefined ? null : {cmd:"eq", band:cmd.band, gain:g};
    }
    if (cmd.on !== undefined) return {cmd:"eq", on:!!last?.eq?.on};
    if (cmd.volume !== undefined) {
      const v = last?.eq?.volume;
      return v === undefined ? null : {cmd:"eq", volume:v};
    }
  }
  if (cmd.cmd === "file") {
    const f = last.slots?.[cmd.slot]?.file;
    return f ? {cmd:"file", slot:cmd.slot, file:f} : null;
  }
  return null;
}
let pendingSlot = null;
let pendingOldPreset = null;
let pendingPoll = false;
function send(cmd, record = true) {
  if (cmd && cmd.cmd === "slot") {
    pendingSlot = cmd.n;
    pendingOldPreset = last ? last.preset : null;
    pendingPoll = false;
    showSpinner();
  } else if (cmd && (cmd.cmd === "file" || cmd.cmd === "reload" ||
                     (cmd.cmd === "set" && typeof cmd.position === "string"))) {
    pendingSlot = null;
    pendingPoll = true;
    showSpinner();
  }
  if (record) {
    const inv = inverseOf(cmd);
    if (inv) { undoStack.push(inv); if (undoStack.length > 20) undoStack.shift(); undoBtn.disabled = false; }
  }
  fetch("/api/cmd", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(cmd)})
    .then(r => r.json()).then(j => { if (j && !j.error) render(j); }).catch(()=>{});
}
undoBtn.onclick = () => {
  const inv = undoStack.pop();
  undoBtn.disabled = undoStack.length === 0;
  if (inv) send(inv, false);
};
function render(st, fromPoll = false) {
  if (spinnerEl) {
    if (pendingSlot !== null) {
      // Il caricamento e' finito solo quando slot E nome preset sono nuovi.
      if (st.slot === pendingSlot && st.preset !== pendingOldPreset) {
        pendingSlot = null;
        hideSpinner();
      }
    } else if (pendingPoll) {
      if (fromPoll) { pendingPoll = false; hideSpinner(); }
    } else {
      hideSpinner();
    }
  }
  last = st;
  const statustext = document.getElementById("statustext");
  if (statustext) statustext.textContent = `[${st.slot}] `;
  // La combo segue lo slot live; le option arrivano da /api/presets. Durante
  // un cambio preset non si riporta indietro la selezione: aspetta lo stato
  // nuovo (pendingSlot viene azzerato appena il caricamento e' finito).
  const presetSelect = document.getElementById("presetselect");
  if (presetSelect && presetSelect.options.length &&
      (pendingSlot === null || st.slot === pendingSlot)) {
    const v = String(st.slot);
    if ([...presetSelect.options].some(o => o.value === v)) presetSelect.value = v;
  }
  board.children && [...board.children].forEach(card => {
    const id = card._id;
    const s = st.slots[id];
    if (!s) return;
    if (card._power) card._power.classList.toggle("on", !!s.on);
    if (card._filterState) {
      card._filterState.textContent = s.on ? "auto" : "off";
      card._filterState.classList.toggle("on", !!s.on);
      card._filterState.title = s.on ? "acceso dall'espressione" : "spento: si accende col pedale";
    }
    if (card._select && s.type) card._select.value = s.type;
    if (card._select && s.mode) card._select.value = s.mode;
    if (card._pos && typeof s.position === "string") card._pos.value = s.position;
    if (card._file && s.file) {
      const base = s.file.split("/").pop();
      if (![...card._file.options].some(o => o.value === base)) {
        card._file.append(el("option", {value:base, textContent:base}));
      }
      card._file.value = base;
    }
  });
  if (gateUnit) gateUnit._power.classList.toggle("on", !!st.slots.gate?.on);
  if (boostCard) {
    boostCard._power.classList.toggle("on", !!st.boost);
    if (boostCard._knob && st.boost_db !== undefined) {
      if (document.activeElement !== boostCard._knob) boostCard._knob.value = st.boost_db;
      boostCard._out.textContent = (+st.boost_db).toFixed(1) + "dB";
    }
  }
  if (eqUnit) {
    eqUnit._power.classList.toggle("on", !!st.eq?.on);
    if (st.eq && Array.isArray(st.eq.gains)) {
      st.eq.gains.forEach((v, i) => {
        const k = eqSliders[i];
        if (!k) return;
        // Come gli altri knob: mentre si trascina non si sovrascrive il valore.
        if (document.activeElement !== k.inp) k.inp.value = v;
        k.out.textContent = (+v).toFixed(1);
      });
    }
    if (typeof st.eq?.volume === "number") {
      if (document.activeElement !== eqUnit._volume) eqUnit._volume.value = st.eq.volume;
      eqUnit._volumeOut.textContent = (+st.eq.volume).toFixed(1) + " dB";
    }
  }
  if (modCard && st.slots && st.slots.mod) {
    const pos = st.slots.mod.position || "pre_amp";
    if (pos !== lastModPos) {
      lastModPos = pos;
      if (pos === "post_ir" && delayCard) board.insertBefore(modCard, delayCard);
      else if (ampCard) board.insertBefore(modCard, ampCard);
    }
  }
  if (st.autoengage) {
    aeFields.forEach(f => {
      const v = st.autoengage[f.key];
      if (v !== undefined && document.activeElement !== f.inp) f.inp.value = (+v * (f.scale || 1)).toFixed(0);
    });
  }
  if (st.looper) {
    const L = st.looper;
    // Niente corsa della posizione (il poll non la segue): si colora la
    // lunghezza del loop rispetto al massimo.
    const label = (L.state === "idle" && L.len > 0) ? "stop" : L.state;
    const armed = (L.state === "play" && L.armed) ? " · armed" : "";
    loopStateEl.textContent = `${label}${armed} · ${(+L.len).toFixed(1)} s / ${(+L.max).toFixed(0)} s`;
    const stopBtn = document.getElementById("loop-stop");
    if (stopBtn) stopBtn.textContent = (L.state === "idle") ? "▶ play" : "■ stop";
    loopFillEl.style.width = (L.max > 0 ? Math.min(100, 100 * L.len / L.max) : 0) + "%";
    loopSection.classList.toggle("active", L.state !== "idle");
  }
  knobs.forEach(k => {
    const v = st.slots[k.slot] ? st.slots[k.slot][k.key] : undefined;
    if (v === undefined) return;
    if (document.activeElement !== k.inp) k.inp.value = v;
    k.out.textContent = (+v).toFixed(k.step < 0.1 ? 2 : 1) + k.unit;
  });
}
let failCount = 0;
function refresh() {
  fetch("/api/state").then(r => r.json()).then(j => {
    if (j && !j.error) { failCount = 0; render(j, true); }
    else if (++failCount > 10) document.getElementById("statustext").textContent = "disconnesso";
  }).catch(() => { if (++failCount > 10) document.getElementById("statustext").textContent = "disconnesso"; });
}
// Combo preset: /api/presets legge config/presets.json. Fetch iniziale con
// retry (il server puo' essere appena partito o riavviato).
const presetSelect = document.getElementById("presetselect");
function loadPresets(attempt = 0) {
  fetch("/api/presets").then(r => r.json()).then(list => {
    if (!Array.isArray(list) || !list.length) throw new Error("lista preset vuota");
    presetSelect.textContent = "";
    list.forEach(p => presetSelect.append(el("option", {value:String(p.slot), textContent:p.name})));
    if (last) presetSelect.value = String(last.slot);
  }).catch(() => {
    if (attempt < 5) setTimeout(() => loadPresets(attempt + 1), 800);
  });
}
presetSelect.onchange = () => {
  const n = +presetSelect.value;
  if (Number.isFinite(n)) send({cmd:"slot", n});
};
loadPresets();

// Rinomina del preset corrente: l'icona apre un input al posto della combo;
// invio salva (engine rename), Esc/uscita annulla. Dopo il rename si ricarica
// la lista cosi' la combo mostra il nuovo nome.
const renameBtn = document.getElementById("renameBtn");
const renameInput = document.getElementById("renameInput");
let renaming = false;
function endRename() {
  renaming = false;
  renameInput.classList.add("hidden");
  presetSelect.classList.remove("hidden");
}
renameBtn.onclick = () => {
  renaming = true;
  const cur = presetSelect.options[presetSelect.selectedIndex];
  renameInput.value = cur ? cur.textContent : "";
  presetSelect.classList.add("hidden");
  renameInput.classList.remove("hidden");
  renameInput.focus();
  renameInput.select();
};
function commitRename() {
  const n = renameInput.value.trim();
  if (!n) { endRename(); return; }
  fetch("/api/cmd", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({cmd:"rename", name:n})})
    .then(r => r.json()).then(j => { endRename(); if (j && !j.error) loadPresets(); })
    .catch(() => endRename());
}
renameInput.onkeydown = (e) => {
  if (e.key === "Enter") commitRename();
  else if (e.key === "Escape") endRename();
};
renameInput.onblur = () => { if (renaming) commitRename(); };

// Menu hamburger (solo sotto 720 px): contiene gli stessi undo/Salva/settings
// dell'header desktop, con gli stessi handler.
const menuBtn = document.getElementById("menu");
const actionsEl = document.getElementById("actions");
function closeMenu() {
  actionsEl.classList.remove("open");
  menuBtn.setAttribute("aria-expanded", "false");
}
menuBtn.onclick = (e) => {
  e.stopPropagation();
  const open = actionsEl.classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
};
actionsEl.addEventListener("click", (e) => {
  if (e.target.closest("button, a")) closeMenu();
});
document.addEventListener("click", (e) => {
  if (!actionsEl.classList.contains("open")) return;
  if (actionsEl.contains(e.target) || menuBtn.contains(e.target)) return;
  closeMenu();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
window.addEventListener("resize", () => { if (window.innerWidth > 720) closeMenu(); });

const saveBtn = document.getElementById("save");
saveBtn.onclick = () => {
  saveBtn.classList.remove("saved", "err");
  saveBtn.textContent = "…";
  const done = (ok) => {
    saveBtn.textContent = ok ? "Salvato ✓" : "Errore";
    saveBtn.classList.add(ok ? "saved" : "err");
    setTimeout(() => { saveBtn.textContent = "Salva"; saveBtn.classList.remove("saved", "err"); }, 1200);
  };
  fetch("/api/save", {method:"POST"}).then(r=>r.json()).then(j=>{
    if (j && !j.error) { render(j); done(true); } else { done(false); }
  }).catch(()=>done(false));
};
["models","irs"].forEach(kind => fetch(`/api/files?kind=${kind}`).then(r=>r.json()).then(j=>{
  const slotId = kind === "models" ? "amp" : "ir";
  const card = [...board.children].find(c => c._id === slotId);
  if (!card || !card._file) return;
  (j.files||[]).forEach(f => card._file.append(el("option", {value:f, textContent:f})));
}).catch(()=>{}));

refresh(); setInterval(refresh, 400);
</script>

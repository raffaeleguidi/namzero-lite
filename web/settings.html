<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>namzero-lite · settings</title>
<style>
body { margin:0; font:14px/1.4 -apple-system,system-ui,sans-serif; background:#15171c; color:#e6e9ef; }
header { padding:12px 16px; border-bottom:1px solid #2c3240; display:flex; gap:12px; align-items:center; }
h1 { font-size:16px; margin:0; }
a { color:#4fd1c5; text-decoration:none; }
main { padding:16px; display:flex; gap:24px; flex-wrap:wrap; }
section { background:#1e222b; border:1px solid #2c3240; border-radius:12px; padding:12px; min-width:260px; }
h2 { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:#8b93a7; margin:0 0 8px; }
input[type=file] { color:#e6e9ef; }
li { color:#4fd1c5; font-family:ui-monospace,monospace; font-size:12px; }
.btn { display:inline-block; padding:5px 10px; background:#1e222b; color:#e6e9ef; border:1px solid #4fd1c5; border-radius:6px; text-decoration:none; font-size:13px; cursor:pointer; }
</style></head><body>
<header><h1>Settings</h1><a href="index.html">← pedaliera</a></header>
<main>
<section><h2>Modelli NAM (.nam)</h2><input type="file" id="up-models" accept=".nam"><ul id="list-models"></ul></section>
<section><h2>IR (.wav)</h2><input type="file" id="up-irs" accept=".wav"><ul id="list-irs"></ul></section>
<section><h2>TONE3000</h2>
<p id="t3k-status" style="color:#8b93a7;font-size:12px">…</p>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
  <a class="btn" href="/t3k/start?gear=amp">Scegli ampli</a>
  <a class="btn" href="/t3k/start?gear=ir">Scegli IR</a>
  <button class="btn" id="t3k-disc">Disconnetti</button>
</div></section>
<section><h2>Reti WiFi conosciute</h2>
<p style="color:#8b93a7;font-size:12px">Il Pi si collega alla prima rete raggiungibile, in ordine di priorità.</p>
<table id="wifi" style="border-collapse:collapse;font-size:13px"></table>
<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
  <input id="w-ssid" placeholder="SSID" style="padding:4px;background:#12151b;color:#e6e9ef;border:1px solid #2c3240;border-radius:6px">
  <input id="w-pass" placeholder="password" style="padding:4px;background:#12151b;color:#e6e9ef;border:1px solid #2c3240;border-radius:6px">
  <input id="w-prio" placeholder="priorità" value="0" style="width:70px;padding:4px;background:#12151b;color:#e6e9ef;border:1px solid #2c3240;border-radius:6px">
  <button id="w-add" style="padding:4px 10px;background:#1e222b;color:#e6e9ef;border:1px solid #4fd1c5;border-radius:6px;cursor:pointer">Aggiungi</button>
</div></section>
</main>
<script>
function upload(kind, inp) {
  const f = inp.files[0]; if (!f) return;
  fetch(`/api/upload?kind=${kind}`, {method:"POST", headers:{"X-Filename":f.name}, body:f})
    .then(r=>r.json()).then(j=>{ if (j.error) alert(j.error); inp.value=""; load();

let wifi = [];
function renderWifi() {
  const t = document.getElementById("wifi"); t.innerHTML = "";
  wifi.forEach((n, i) => {
    const tr = document.createElement("tr");
    const a = document.createElement("td"); a.textContent = n.ssid; a.style.padding = "3px 8px";
    const b = document.createElement("td"); b.textContent = "•".repeat(Math.min(8, (n.password||"").length)); b.style.padding = "3px 8px";
    const c = document.createElement("td"); c.textContent = n.priority; c.style.padding = "3px 8px";
    const d = document.createElement("td");
    const del = document.createElement("button"); del.textContent = "✕";
    del.onclick = () => { wifi.splice(i,1); saveWifi(); };
    d.append(del); tr.append(a,b,c,d); t.append(tr);
  });
}
function saveWifi() {
  fetch("/api/wifi", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({networks:wifi})})
    .then(r=>r.json()).then(j=>{ if (j.networks) { wifi = j.networks; renderWifi(); } });
}
function loadWifi() {
  fetch("/api/wifi").then(r=>r.json()).then(j=>{ wifi = j.networks || []; renderWifi(); });
}
document.getElementById("w-add").onclick = () => {
  const ssid = document.getElementById("w-ssid").value.trim();
  if (!ssid) return;
  wifi.push({ssid, password:document.getElementById("w-pass").value, priority:parseInt(document.getElementById("w-prio").value||"0",10)});
  document.getElementById("w-ssid").value = ""; document.getElementById("w-pass").value = "";
  saveWifi();
};
loadWifi();

function t3kStatus() {
  fetch("/api/t3k/status").then(r=>r.json()).then(j=>{
    const el = document.getElementById("t3k-status");
    if (!j.configured) el.textContent = "client_id mancante in config/tone3000.json";
    else el.textContent = j.connected ? "account collegato" : "account non collegato";
  }).catch(()=>{});
}
document.getElementById("t3k-disc").onclick = () => fetch("/api/t3k/disconnect", {method:"POST"}).then(t3kStatus);
t3kStatus(); });
}
function load() {
  ["models","irs"].forEach(kind => fetch(`/api/files?kind=${kind}`).then(r=>r.json()).then(j=>{
    const ul = document.getElementById("list-"+kind); ul.innerHTML = "";
    (j.files||[]).forEach(f => { const li=document.createElement("li"); li.textContent=f; ul.append(li); });
  }));
}
document.getElementById("up-models").onchange = e => upload("models", e.target);
document.getElementById("up-irs").onchange = e => upload("irs", e.target);
load();

let wifi = [];
function renderWifi() {
  const t = document.getElementById("wifi"); t.innerHTML = "";
  wifi.forEach((n, i) => {
    const tr = document.createElement("tr");
    const a = document.createElement("td"); a.textContent = n.ssid; a.style.padding = "3px 8px";
    const b = document.createElement("td"); b.textContent = "•".repeat(Math.min(8, (n.password||"").length)); b.style.padding = "3px 8px";
    const c = document.createElement("td"); c.textContent = n.priority; c.style.padding = "3px 8px";
    const d = document.createElement("td");
    const del = document.createElement("button"); del.textContent = "✕";
    del.onclick = () => { wifi.splice(i,1); saveWifi(); };
    d.append(del); tr.append(a,b,c,d); t.append(tr);
  });
}
function saveWifi() {
  fetch("/api/wifi", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({networks:wifi})})
    .then(r=>r.json()).then(j=>{ if (j.networks) { wifi = j.networks; renderWifi(); } });
}
function loadWifi() {
  fetch("/api/wifi").then(r=>r.json()).then(j=>{ wifi = j.networks || []; renderWifi(); });
}
document.getElementById("w-add").onclick = () => {
  const ssid = document.getElementById("w-ssid").value.trim();
  if (!ssid) return;
  wifi.push({ssid, password:document.getElementById("w-pass").value, priority:parseInt(document.getElementById("w-prio").value||"0",10)});
  document.getElementById("w-ssid").value = ""; document.getElementById("w-pass").value = "";
  saveWifi();
};
loadWifi();

function t3kStatus() {
  fetch("/api/t3k/status").then(r=>r.json()).then(j=>{
    const el = document.getElementById("t3k-status");
    if (!j.configured) el.textContent = "client_id mancante in config/tone3000.json";
    else el.textContent = j.connected ? "account collegato" : "account non collegato";
  }).catch(()=>{});
}
document.getElementById("t3k-disc").onclick = () => fetch("/api/t3k/disconnect", {method:"POST"}).then(t3kStatus);
t3kStatus();
</script></body></html>
